        const { useState, useEffect, useRef, useMemo } = React;

        // Firebase CDN Imports
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';

        // --- FIREBASE INITIALIZATION ---
        let app, auth, db, appId;
        try {
          const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
          if (firebaseConfig) {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'lms-informatika-9';
          }
        } catch (err) {
          console.warn("Cloud DB not configured. Running in offline/local storage mode.");
        }

        const callGeminiAPI = async (prompt, asJson = false) => {
            const apiKey = ""; // Runtime canvas key injection
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
            };
            
            if (asJson) {
                payload.generationConfig = {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            score: { type: "INTEGER", description: "Nilai gabungan esai skala 0 sampai 100" },
                            feedback: { type: "STRING", description: "Umpan balik atau evaluasi objektif guru maksimal 3-4 kalimat" }
                        },
                        required: ["score", "feedback"]
                    }
                };
            }

            let delay = 1000;
            for (let i = 0; i < 4; i++) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                    const data = await res.json();
                    return data.candidates[0].content.parts[0].text;
                } catch (err) {
                    if (i === 3) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        };

        const sendToGoogleSheet = async (data, webAppUrl) => {
            if (!webAppUrl || !webAppUrl.trim()) return false;
            try {
                await fetch(webAppUrl.trim(), {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return true;
            } catch (err) {
                console.error("Gagal sinkronisasi ke Google Sheet:", err);
                return false;
            }
        };

            videoId: 'P9TKC_mkdzo',
            materi: `Berpikir komputasional (Computational Thinking) adalah metode menyelesaikan persoalan secara sistematis dengan menerapkan teknik ilmu komputer (informatika). Terdapat 4 pilar utama berpikir komputasional:

1. Dekomposisi (Decomposition): Memecah masalah besar/kompleks menjadi bagian-bagian kecil yang lebih mudah dikelola dan diselesaikan.
2. Pengenalan Pola (Pattern Recognition): Mencari pola, kemiripan, atau kesamaan bentuk dalam sebuah masalah dengan pengalaman terdahulu.
3. Abstraksi (Abstraction): Menyaring dan mengabaikan bagian yang tidak penting dari suatu permasalahan, serta berfokus penuh pada informasi inti yang relevan.
4. Algoritma (Algorithm): Menyusun langkah-langkah logis dan terurut secara sistematis untuk menyelesaikan masalah atau mencapai tujuan.

Struktur Data Penting di Kelas 9:
- Stack (Tumpukan): Berprinsip LIFO (Last In First Out), elemen terakhir masuk adalah yang pertama keluar (Contoh: tumpukan piring, tombol Undo).
- Queue (Antrean): Berprinsip FIFO (First In First Out), elemen pertama masuk adalah yang pertama keluar (Contoh: antrean kasir, cetakan dokumen printer).
- Tree (Pohon): Struktur hierarkis yang memiliki Akar (Root), Cabang (Branch), dan Daun (Leaf) (Contoh: Struktur Organisasi, Folder File OS).
- Graph (Graf): Jaringan hubungan antarnode/simpul yang terhubung oleh garis edge (Contoh: Jaringan peta rute Google Maps, hubungan teman di media sosial).`,
            quiz: [
              { q: "Sebuah tim pengembang merancang sistem pendaftaran siswa baru. Mereka mengabaikan data hobi dan ukuran baju, serta fokus menyimpan NIK, Nama, dan Nilai Rapor. Pilar Berpikir Komputasional yang mendasari keputusan ini adalah...", options: ["A. Dekomposisi", "B. Pengenalan Pola", "C. Abstraksi", "D. Algoritma"], answer: 2 },
              { q: "Seorang guru menumpuk naskah ujian di meja. Saat mengoreksi, guru selalu mengambil naskah yang berada di urutan paling atas. Karakteristik ini menerapkan konsep struktur data...", options: ["A. Queue (Antrean)", "B. Stack (Tumpukan)", "C. Tree (Pohon)", "D. Graph (Graf)"], answer: 1 },
              { q: "OSIS membuat struktur kepengurusan yang menunjukkan hubungan Ketua -> Koordinator -> Anggota Divisi. Setiap anggota berada di bawah satu koordinator. Struktur data paling tepat adalah...", options: ["A. Tree", "B. Graph", "C. Stack", "D. Queue"], answer: 0 },
              { q: "Dalam menentukan rute perjalanan terpendek antar kota yang saling terhubung oleh banyak jalur alternatif, struktur data yang paling efisien digunakan adalah...", options: ["A. Tree", "B. Array", "C. Stack", "D. Graph"], answer: 3 }

            videoId: 'RymnCmreBuY',
            materi: `Teknologi Informasi dan Komunikasi (TIK) berfokus pada pengolahan, pengelolaan, integrasi, dan penyampaian data/informasi secara efektif.

1. Integrasi Konten Aplikasi Perkantoran:
- Copy & Paste Link: Mengintegrasikan data antar aplikasi (seperti Excel ke Word) sehingga perubahan data di tabel sumber (Excel) akan secara otomatis memperbarui tampilan di aplikasi tujuan (Word).
- OLE (Object Linking and Embedding): Teknologi yang memungkinkan dokumen memasukkan objek dinamis dari aplikasi lain (seperti bagan/grafik Excel ke slide PowerPoint).

2. Fitur Lanjutan Otomatisasi:
- Mail Merge (Surat Massal): Fitur di Word untuk membuat surat, sertifikat, atau label massal secara cepat dengan menggabungkan dokumen utama dan sumber data (database Excel).

3. Berbagi Konten Digital:
- Blog: Media publikasi tulisan digital, jurnal, atau portofolio interaktif.
- Vlog (Video Blog): Konten edukasi atau informasi berbentuk video. Proses pembuatan vlog meliputi tiga tahapan utama:
  a. Pra-Produksi: Perencanaan, penulisan naskah (scripting), dan pembuatan rancangan adegan (storyboard).
  b. Produksi: Proses pengambilan gambar/suara (shooting) di lapangan.
  c. Pasca-Produksi: Proses penyuntingan video (editing), penambahan teks/audio, dan pengunggahan (uploading).`,
            quiz: [

              { q: "Untuk mempresentasikan laporan dinamis dari Excel dalam slide PowerPoint secara interaktif, teknologi yang digunakan adalah...", options: ["A. OLE (Object Linking and Embedding)", "B. Mail Merge", "C. Hyperlink", "D. Bookmark"], answer: 0 },
              { q: "OSIS ingin mempublikasikan warta kegiatan sekolah yang memuat teks artikel, galeri foto, dan kolom komentar pembaca. Media digital yang tepat adalah...", options: ["A. Vlog", "B. Microsoft Word", "C. Blog", "D. Spreadsheet"], answer: 2 },
              { q: "Tahapan Pra-Produksi dalam pembuatan konten Vlog Edukasi meliputi kegiatan...", options: ["A. Color grading dan rendering", "B. Pengambilan gambar di studio", "C. Menyusun naskah dan storyboard", "D. Mengunggah video ke internet"], answer: 2 }
            ],
            essay: [
              { q: "Jelaskan alur integrasi data laporan keuangan dari Microsoft Excel, penyusunan naskah di Word, hingga pembuatan presentasi di PowerPoint dengan memanfaatkan fitur Paste Link / OLE!" },
              { q: "Tuliskan Standar Operasional Prosedur (SOP) secara runtut mulai dari tahap Pra-Produksi, Produksi, hingga Pasca-Produksi saat tim siswa membuat Vlog Edukasi Sekolah!" }
            ]
          },
          sk: {
            id: 'sk',
            title: 'Sistem Komputer (SK)',
            badge: 'Modul 3',
            icon: 'fa-microchip',
            color: 'from-emerald-600 to-teal-600',
            bgColor: 'bg-emerald-50 text-emerald-700 border-emerald-200',
            videoId: '7Y8G40pThl8',
            materi: `Sistem Komputer membahas bagaimana perangkat keras (Hardware), perangkat lunak (Software), dan manusia (Brainware) berinteraksi secara harmonis.

1. Arsitektur Komputer & CPU:
- ALU (Arithmetic Logic Unit): Melakukan perhitungan aritmatika (+, -, *, /) dan logika (AND, OR, NOT).
- CU (Control Unit): Mengatur lalu lintas data dan instruksi dalam seluruh sistem komputer.
- Register: Memori kecepatan tinggi di dalam CPU untuk menyimpan instruksi yang sedang diproses.

2. Sistem Bilangan Digital:
- Biner (Basis 2): Menggunakan angka 0 dan 1.
- Oktal (Basis 8): Menggunakan angka 0 sampai 7.
- Desimal (Basis 10): Menggunakan angka 0 sampai 9.
- Heksadesimal (Basis 16): Menggunakan angka 0-9 dan huruf A-F (A=10, B=11, C=12, D=13, E=14, F=15).

3. Mekanisme Kerja Sinyal Digital:
Sinyal logika tinggi (1) mewakili tegangan listrik AKTIF, sedangkan sinyal logika rendah (0) mewakili NON-AKTIF. Pintu logika dasar (AND, OR, NOT) memproses kombinasi sinyal ini untuk menghasilkan keputusan logis dalam sirkuit komputer.`,
            quiz: [
              { q: "Komponen CPU yang bertugas melakukan operasi perhitungan matematika dan pembandingan logika adalah...", options: ["A. Control Unit (CU)", "B. Arithmetic Logic Unit (ALU)", "C. Register", "D. RAM"], answer: 1 },
              { q: "Konversi bilangan biner 1011 ke dalam sistem bilangan desimal menghasilkan nilai...", options: ["A. 11", "B. 13", "C. 15", "D. 9"], answer: 0 },

              { q: "Gerbang logika yang akan menghasilkan output '1' (TRUE) HANYA JIKA seluruh input bernilai '1' adalah...", options: ["A. OR", "B. NOT", "C. AND", "D. XOR"], answer: 2 }

            essay: [
              { q: "Jelaskan siklus instruksi Fetch-Decode-Execute pada CPU saat komputer mengeksekusi sebuah program!" },

        function App() {
          const [authUser, setAuthUser] = useState(null);
          const [currentUser, setCurrentUser] = useState(null); 
          const [currentView, setCurrentView] = useState('login'); // 'login', 'dashboard', 'module'
          
          // Login Form States
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');
          const [loginError, setLoginError] = useState('');

          // Learning Module States
          const [activeModule, setActiveModule] = useState(null);
          const [learningStep, setLearningStep] = useState(1); // 1: Material & AI, 2: Quiz PG, 3: Essay
          const [quizAnswers, setQuizAnswers] = useState({});
          const [essayAnswers, setEssayAnswers] = useState({});
          const [quizScore, setQuizScore] = useState(null);
          const [isSubmitting, setIsSubmitting] = useState(false); 

          // Gemini AI Assistant States
          const [aiQuery, setAiQuery] = useState('');
          const [aiResponse, setAiResponse] = useState('');
          const [isAiLoading, setIsAiLoading] = useState(false);

          // Admin / Teacher States
          const [studentsList, setStudentsList] = useState(DEFAULT_STUDENTS);
          const [resultsData, setResultsData] = useState([]);
          const [selectedEssayData, setSelectedEssayData] = useState(null);
          const [essayScoreInput, setEssayScoreInput] = useState(''); 
          const [essayFeedbackInput, setEssayFeedbackInput] = useState(''); 
          const [isAiGrading, setIsAiGrading] = useState(false); 
          const [gscriptUrl, setGscriptUrl] = useState(() => localStorage.getItem('lms_gscript_url') || '');

          // Admin Dashboard UI Filter & Tabs
          const [adminTab, setAdminTab] = useState('infografis'); // 'infografis', 'rekap', 'koreksi', 'belum_mengerjakan', 'siswa', 'gsheet'
          const [searchTerm, setSearchTerm] = useState('');
          const [classFilter, setClassFilter] = useState('semua');
          const [pendingModuleFilter, setPendingModuleFilter] = useState('semua');
          const [selectedResultIds, setSelectedResultIds] = useState([]);

          // Student Form Admin State
          const [newNis, setNewNis] = useState('');
          const [newNama, setNewNama] = useState('');
          const [newKelas, setNewKelas] = useState('9A');
          const [newJk, setNewJk] = useState('L');

          // Custom UI Alerts & Confirmation Modals
          const [notification, setNotification] = useState({ show: false, type: '', message: '' });
          const [confirmDialog, setConfirmDialog] = useState({ show: false, message: '', onConfirm: null });

          useEffect(() => {
            if (!auth) return;
            const initAuth = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (err) {
                console.warn("Auth streaming fallback to anonymous/local session.", err);
              }
            };
            initAuth();
            
            const unsubscribe = onAuthStateChanged(auth, setAuthUser);
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!db || !authUser) {
              const localRes = localStorage.getItem('lms_results');
              if (localRes) {
                try { setResultsData(JSON.parse(localRes)); } catch(e){}
              }
              const localStud = localStorage.getItem('lms_students');
              if (localStud) {
                try { setStudentsList(JSON.parse(localStud)); } catch(e){}
              }
              return;
            }

            // Sync Students Collection
            const unsubscribeStudents = onSnapshot(
              doc(db, 'artifacts', appId, 'public', 'data', 'lms_data', 'students'),
              (docSnap) => {
                if (docSnap.exists() && docSnap.data().list) {
                  try {
                    setStudentsList(JSON.parse(docSnap.data().list));
                  } catch (e) {
                    console.error("Error parsing student data", e);
                  }
                }
              },
              (error) => console.error("Snapshot error students:", error)
            );

            // Sync Results Collection
            const unsubscribeResults = onSnapshot(
              collection(db, 'artifacts', appId, 'public', 'data', 'lms_results'),
              (snapshot) => {
                const results = [];
                snapshot.forEach(docSnap => {
                  results.push({ id: docSnap.id, ...docSnap.data() });
                });
                const sorted = results.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                setResultsData(sorted);
              },
              (error) => console.error("Snapshot error results:", error)
            );

            // Sync Config
            const unsubscribeGscript = onSnapshot(
              doc(db, 'artifacts', appId, 'public', 'data', 'lms_data', 'config'),
              (docSnap) => {
                if (docSnap.exists() && docSnap.data().gscriptUrl) {
                  setGscriptUrl(docSnap.data().gscriptUrl);
                  localStorage.setItem('lms_gscript_url', docSnap.data().gscriptUrl);
                }
              },
              (error) => console.error("Snapshot error config:", error)
            );

            return () => {
              unsubscribeStudents();
              unsubscribeResults();
              unsubscribeGscript();

          }, [authUser]);

          const showNotice = (type, message) => {
            setNotification({ show: true, type, message });

             setGscriptUrl(urlToSave);

            setIsAiLoading(true);

Tugas: Jawab pertanyaan siswa kelas 9 tentang materi "${course.title}".
Rangkuman Materi: "${course.materi}"

- Gunakan bahasa yang santun, memotivasi, dan mudah dicerna anak remaja usia 14-15 tahun.
- Berikan poin-poin singkat atau contoh sederhana dalam kehidupan sehari-hari jika membantu.
- Gunakan beberapa emoji yang sesuai agar lebih bersahabat.
- JANGAN langsung memberikan kunci jawaban spesifik jika siswa menanyakan soal kuis/ujian, melainkan jelaskan konsep dasarnya.`;
            
            try {
                const response = await callGeminiAPI(prompt);

                    {/* TAB 3: KOREKSI ESAI & AI AUTO-GRADER */}
                    {adminTab === 'koreksi' && (
                      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6">
                        <h3 className="text-lg font-bold text-slate-800">Lembar Koreksi Jawaban Esai Siswa</h3>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {pendingCorrectionList.length === 0 ? (
                            <div className="col-span-2 p-12 text-center text-slate-400 border-2 border-dashed border-slate-200 rounded-2xl">
                              <i className="fas fa-check-circle text-4xl text-emerald-400 mb-2"></i>
                              <p className="font-bold text-slate-600">Semua tugas esai telah dikoreksi!</p>
                            </div>
                          ) : (
                            pendingCorrectionList.map(item => (
                              <div key={item.id} className="p-5 rounded-2xl border border-slate-200 bg-slate-50 space-y-3">
                                <div className="flex justify-between items-start">
                                  <div>
                                    <h4 className="font-bold text-slate-900 text-sm">{item.nama} ({item.nis})</h4>
                                    <p className="text-xs text-slate-500">Kelas {item.kelas} • {item.module}</p>
                                  </div>
                                  <span className="px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold">
                                    Perlu Dikoreksi
                                  </span>
                                </div>

                                <button 
                                  onClick={() => {
                                    setSelectedEssayData(item);
                                    setEssayScoreInput(item.scoreEsai !== null ? item.scoreEsai.toString() : '');
                                    setEssayFeedbackInput(item.feedbackEsai || '');
                                  }}
                                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition shadow-sm">
                                  Buka Lembar Jawab & AI Grader
                                </button>
                              </div>
                            ))
                          )}
                        </div>
                      </div>
                    )}

                    {/* TAB 4: SISWA BELUM MENGERJAKAN TUGAS */}
                    {adminTab === 'belum_mengerjakan' && (
                      <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                          <h3 className="text-lg font-bold text-slate-800">Siswa Belum Mengirim Tugas</h3>

                          <div className="flex items-center gap-3">
                            <select 
                              value={pendingModuleFilter}
                              onChange={(e) => setPendingModuleFilter(e.target.value)}
                              className="px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                              <option value="semua">Pilih Modul Pembelajaran...</option>
                              {Object.values(COURSE_DATA).map(c => (
                                <option key={c.id} value={c.id}>{c.title}</option>
                              ))}
                            </select>
                          </div>
                        </div>

                        {pendingModuleFilter === 'semua' ? (
                          <div className="p-8 text-center text-slate-400 border border-slate-100 rounded-xl">
                            Silakan pilih modul pembelajaran di atas untuk melihat daftar siswa yang belum mengumpulkan.
                          </div>
                        ) : (
                          <div className="overflow-x-auto border border-slate-200 rounded-xl">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-50 text-slate-500 uppercase text-[10px] font-bold">
                                <tr>
                                  <th className="p-3.5">NIS</th>
                                  <th className="p-3.5">Nama Siswa</th>
                                  <th className="p-3.5">Kelas</th>
                                  <th className="p-3.5">Jenis Kelamin</th>
                                  <th className="p-3.5 text-center">Status</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {studentsNotSubmitted.length === 0 ? (
                                  <tr>
                                    <td colSpan="5" className="p-6 text-center text-emerald-600 font-bold">
                                      🎉 Luar biasa! Seluruh siswa telah mengumpulkan tugas modul ini!
                                    </td>
                                  </tr>
                                ) : (
                                  studentsNotSubmitted.map(s => (
                                    <tr key={s.nis} className="hover:bg-slate-50">
                                      <td className="p-3.5 font-bold text-slate-700">{s.nis}</td>
                                      <td className="p-3.5 font-bold text-slate-900">{s.nama}</td>
                                      <td className="p-3.5">{s.kelas}</td>
                                      <td className="p-3.5">{s.jk === 'L' ? 'Laki-laki' : 'Perempuan'}</td>
                                      <td className="p-3.5 text-center">
                                        <span className="px-2.5 py-1 rounded-full bg-rose-50 text-rose-600 border border-rose-200 font-bold text-[10px]">
                                          Belum Mengumpulkan
                                        </span>
                                      </td>
                                    </tr>
                                  ))
                                )}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    )}

                    {/* TAB 5: MANAJEMEN SISWA */}
                    {adminTab === 'siswa' && (
                      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* Add Student Form */}
                        <div className="lg:col-span-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit space-y-4">
                          <h3 className="text-base font-bold text-slate-800">Tambah Siswa Baru</h3>
                          <form onSubmit={handleAddStudent} className="space-y-3">
                            <div>
                              <label className="block text-xs font-bold text-slate-600 uppercase mb-1">NIS Siswa</label>
                              <input 
                                type="text" 
                                required
                                value={newNis}
                                onChange={(e) => setNewNis(e.target.value)}
                                placeholder="cth: 21400"
                                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>

                            <div>
                              <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Nama Lengkap</label>
                              <input 
                                type="text" 
                                required
                                value={newNama}
                                onChange={(e) => setNewNama(e.target.value)}
                                placeholder="Nama siswa..."
                                className="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>

                            <div className="grid grid-cols-2 gap-3">
                              <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Kelas</label>
                                <select 
                                  value={newKelas}
                                  onChange={(e) => setNewKelas(e.target.value)}
                                  className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                  <option value="9A">9A</option>
                                  <option value="9B">9B</option>
                                  <option value="9C">9C</option>
                                </select>
                              </div>

                              <div>
                                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">JK</label>
                                <select 
                                  value={newJk}
                                  onChange={(e) => setNewJk(e.target.value)}
                                  className="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                  <option value="L">Laki-laki</option>
                                  <option value="P">Perempuan</option>
                                </select>
                              </div>
                            </div>

                            <button 
                              type="submit"
                              className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs shadow-md transition">
                              Simpan Siswa Baru
                            </button>
                          </form>
                        </div>

                        {/* Student Database Table */}
                        <div className="lg:col-span-8 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                          <h3 className="text-base font-bold text-slate-800">Daftar Terdaftar ({studentsList.length} Siswa)</h3>
                          <div className="overflow-x-auto border border-slate-200 rounded-xl max-h-[450px]">
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-50 text-slate-500 uppercase text-[10px] font-bold sticky top-0">
                                <tr>
                                  <th className="p-3.5">NIS</th>
                                  <th className="p-3.5">Nama Siswa</th>
                                  <th className="p-3.5">Kelas</th>
                                  <th className="p-3.5">JK</th>
                                  <th className="p-3.5 text-center">Aksi</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-slate-100">
                                {studentsList.map(s => (
                                  <tr key={s.nis} className="hover:bg-slate-50">
                                    <td className="p-3.5 font-bold text-slate-700">{s.nis}</td>
                                    <td className="p-3.5 font-bold text-slate-900">{s.nama}</td>
                                    <td className="p-3.5">{s.kelas}</td>
                                    <td className="p-3.5">{s.jk}</td>
                                    <td className="p-3.5 text-center">
                                      <button 
                                        onClick={() => handleDeleteStudent(s.nis)}
                                        className="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 transition inline-flex items-center justify-center">
                                        <i className="fas fa-trash-alt"></i>
                                      </button>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* TAB 6: GOOGLE SHEETS INTEGRATION CONFIGURATION */}
                    {adminTab === 'gsheet' && (
                      <div className="max-w-2xl mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-5">
                        <div className="flex items-center gap-3 border-b border-slate-100 pb-4">
                          <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl font-bold">
                            <i className="fas fa-file-excel"></i>
                          </div>
                          <div>
                            <h3 className="text-base font-bold text-slate-800">Integrasi Otomatis Google Sheets</h3>
                            <p className="text-xs text-slate-500">Sinkronisasi otomatis hasil jawaban siswa langsung ke Google Spreadsheet</p>
                          </div>
                        </div>

                        <div className="space-y-3">
                          <label className="block text-xs font-bold text-slate-700 uppercase">URL WebApp Apps Script</label>
                          <input 
                            type="text" 
                            value={gscriptUrl}
                            onChange={(e) => setGscriptUrl(e.target.value)}
                            placeholder="https://script.google.com/macros/s/.../exec"
                            className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500 font-mono"
                          />
                          <p className="text-[11px] text-slate-500 leading-relaxed">
                            Tempelkan URL eksekusi Google Apps Script (Web App Deployment) di atas. Setiap siswa mengumpulkan kuis atau esai, hasilnya akan otomatis terkirim tanpa menekan tombol export.
                          </p>
                        </div>

                        <button 
                          onClick={() => handleSaveGscriptUrl(gscriptUrl)}
                          className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md transition">
                          Simpan URL WebApp Google Sheets
                        </button>
                      </div>
                    )}

                    {/* ESSAY GRADING & AI AUTO-GRADER MODAL */}
                    {selectedEssayData && (
                      <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in">
                        <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 space-y-6 max-h-[90vh] overflow-y-auto">
                          <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                            <div>
                              <h3 className="text-lg font-bold text-slate-800">Koreksi Lembar Jawab Esai</h3>
                              <p className="text-xs text-slate-500">{selectedEssayData.nama} ({selectedEssayData.nis}) • Modul {selectedEssayData.module}</p>
                            </div>
                            <button 
                              onClick={() => setSelectedEssayData(null)}
                              className="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 flex items-center justify-center">
                              <i className="fas fa-times"></i>
                            </button>
                          </div>

                          {/* Submitted Essay Answers */}
                          <div className="space-y-4">
                            {selectedEssayData.essayData?.map((item, idx) => (
                              <div key={idx} className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2 text-xs">
                                <p className="font-bold text-slate-800">Soal {idx + 1}: {item.question}</p>
                                <div className="p-3 bg-white rounded-lg border border-slate-200 text-slate-700 font-medium whitespace-pre-line">
                                  {item.answer}
                                </div>
                              </div>
                            ))}
                          </div>

                          {/* AI Auto-Grader Action */}
                          <div className="p-4 bg-purple-50 rounded-2xl border border-purple-200 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-xl bg-purple-600 text-white flex items-center justify-center text-lg shadow-md">
                                <i className="fas fa-robot"></i>
                              </div>
                              <div>
                                <h4 className="font-bold text-xs text-purple-900">AI Auto-Grader (Gemini)</h4>
                                <p className="text-[11px] text-purple-700">Analisis otomatis kualitas jawaban & beri rekomendasi nilai</p>
                              </div>
                            </div>

                            <button 
                              onClick={handleAiGrader}
                              disabled={isAiGrading}
                              className="px-4 py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl text-xs shadow-md transition disabled:opacity-50 flex items-center gap-2">
                              {isAiGrading ? (
                                <>
                                  <i className="fas fa-spinner fa-spin"></i>
                                  <span>Menganalisis...</span>
                                </>
                              ) : (
                                <>
                                  <i className="fas fa-sparkles"></i>
                                  <span>Jalankan AI Grader</span>
                                </>
                              )}
                            </button>
                          </div>

                          {/* Teacher Manual Input Score & Feedback */}
                          <div className="space-y-4 pt-2">
                            <div>
                              <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Total Nilai Esai (0 - 100)</label>
                              <input 
                                type="number" 
                                min="0" 
                                max="100"
                                value={essayScoreInput}
                                onChange={(e) => setEssayScoreInput(e.target.value)}
                                placeholder="cth: 85"
                                className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>

                            <div>
                              <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Catatan Umpan Balik Guru</label>
                              <textarea 
                                rows="3"
                                value={essayFeedbackInput}
                                onChange={(e) => setEssayFeedbackInput(e.target.value)}
                                placeholder="Tuliskan apresiasi atau penjelasan perbaikan untuk siswa..."
                                className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                              ></textarea>
                            </div>
                          </div>

                          <div className="flex justify-end gap-3 pt-2">
                            <button 
                              onClick={() => setSelectedEssayData(null)}
                              className="px-4 py-2.5 rounded-xl text-slate-600 bg-slate-100 hover:bg-slate-200 font-semibold text-xs transition">
                              Batal
                            </button>
                            <button 
                              onClick={handleSaveEssayScore}
                              className="px-6 py-2.5 rounded-xl text-white bg-indigo-600 hover:bg-indigo-700 font-bold text-xs shadow-md transition">
                              Simpan Hasil Koreksi
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </main>

              {/* FOOTER */}
              <footer className="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-auto">
                <p>LMS Informatika Kelas 9 SMP • Kurikulum Merdeka • Powered by Gemini 3 Flash AI</p>
              </footer>
            </div>
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
